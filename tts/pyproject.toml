[project]
name = "nailong-tts"
version = "0.1.0"
description = "奶龙音色 TTS：数据集打包与引擎接口（引擎待定）"
requires-python = ">=3.10"
dependencies = ["nailong", "numpy", "soundfile"]

[project.scripts]
nailong-tts = "nailong_tts.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nailong_tts"]

[tool.uv.sources]
nailong = { workspace = true }
